<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSME Portal Login</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #003366; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #003366; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #002244; }
        .btn-msme { background-color: #28a745; margin-top: 15px; text-decoration: none; display: inline-block; width: 100%; padding: 12px; color: white; border-radius: 6px; font-weight: bold; }
        .btn-msme:hover { background-color: #218838; }
        .btn-logout { background-color: #dc3545; }
        .btn-logout:hover { background-color: #c82333; }
        .hidden { display: none; }
        .error { color: #d9534f; font-size: 14px; margin-top: 5px; }
        .info-card { background-color: #e9ecef; padding: 15px; border-radius: 6px; text-align: left; margin: 15px 0; }
    </style>
</head>
<body>

<!-- Login Form -->
<div class="box" id="loginBox">
    <h2>MSME પ્લેટફોર્મ લોગિન</h2>
    <input type="text" id="userid" placeholder="User ID">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">લોગિન કરો</button>
    <p id="errorMsg" class="error"></p>
</div>

<!-- Dashboard / MSME Panel -->
<div class="box hidden" id="dashboardBox">
    <h2>Welcome to Dashboard</h2>
    <div class="info-card">
        <p><strong>User ID:</strong> <span id="userDisplay"></span></p>
        <p><strong>Status:</strong> Successfully Logged In</p>
    </div>

    <!-- Official MSME Site Link -->
    <a href="https://udyamregistration.gov.in/" target="_blank" class="btn-msme">
        MSME (Udyam) સત્તાવાર પોર્ટલ ખોલો 🔗
    </a>

    <button onclick="logout()" class="btn-logout">Logout</button>
</div>

<script>
    // Login Credentials
    const CORRECT_ID = "30062001";
    const CORRECT_PASS = "Ashokds@.2001";

    // Check login state on page load
    window.onload = function() {
        if (sessionStorage.getItem("isLoggedIn") === "true") {
            showDashboard();
        }
    };

    function login() {
        const idInput = document.getElementById("userid").value.trim();
        const passInput = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("errorMsg");

        if (idInput === CORRECT_ID && passInput === CORRECT_PASS) {
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("loggedUser", idInput);
            showDashboard();
        } else {
            errorMsg.innerText = "ખોટો User ID અથવા Password!";
        }
    }

    function showDashboard() {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dashboardBox").classList.remove("hidden");
        document.getElementById("userDisplay").innerText = sessionStorage.getItem("loggedUser");
    }

    function logout() {
        sessionStorage.clear();
        location.reload();
    }

    // Auto Logout feature (when leaving page or closing tab)
    window.addEventListener("pagehide", function () {
        sessionStorage.clear();
    });
</script>

</body>
</html>
