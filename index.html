<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHOK DIGITAL SERVICES</title>
    <!-- [બાકીનો CSS અને Font અહીં પહેલા જેવો જ રહેશે] -->
    <style>
        /* [તમારો જૂનો CSS અહીં જ રહેશે] */
        
        /* નવો લોગિન મોડલ CSS */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b4c8c;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- લોગિન મોડલ (શરૂઆતમાં આ દેખાશે) -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>લોગિન કરો</h2>
            <input type="text" id="userId" placeholder="ID દાખલ કરો">
            <input type="password" id="userPass" placeholder="પાસવર્ડ દાખલ કરો">
            <button onclick="checkLogin()">લોગિન</button>
            <p id="error-msg" style="color:red; margin-top:10px; display:none;">ખોટું ID અથવા પાસવર્ડ!</p>
        </div>
    </div>

    <!-- [તમારો બાકીનો બધો HTML કોડ અહીં આવશે...] -->

    <script>
        // પેજ લોડ થાય ત્યારે લોગિન ચેક કરો
        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                document.getElementById("login-overlay").style.display = "none";
            }
        };

        function checkLogin() {
            var id = document.getElementById("userId").value;
            var pass = document.getElementById("userPass").value;

            // તમારો ID અને Password
            if (id === "30062001" && pass === "Ashokds@.2001") {
                sessionStorage.setItem("isLoggedIn", "true");
                document.getElementById("login-overlay").style.display = "none";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
    </script>
</body>
</html>
